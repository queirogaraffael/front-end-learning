<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Perfil de Usuário</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/perfil.css">
  <link rel="stylesheet" href="css/aviso.css">
  <link rel="stylesheet" href="css/botao.css">
</head>

<body>
  <h1>Perfil</h1>

  <div id="perfil">

    <p class="nome">Nome: Joana Silva</p>
    <p class="descricao">Desenvolvedora front-end apaixonada por design.</p>
    <p class="status online">Status: Online</p>
    <p class="status offline">Status: Offline</p>
    <p class="erro">Erro ao carregar a foto.</p>
    <p class="sucesso">Dados salvos com sucesso.</p>

    <button class="botao-editar">
        Editar Perfil
    </button>

  </div>

  <div class="aviso importante">
    Atenção: Atualize seu perfil.
  </div>

</body>

</html>
